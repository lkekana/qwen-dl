[project]
name = "qwen-dl"
version = "0.4.0"
description = "A simple little CLI to download and delete chats from Qwen AI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "argparse>=1.4.0",
    "browser-cookie3>=0.20.1",
    "commentjson>=0.9.0",
    "requests>=2.32.5",
    "typeguard>=4.6.0",
    "uaforge",
]

[tool.uv.sources]
uaforge = { git = "https://github.com/sarperavci/uaforge.git" }
